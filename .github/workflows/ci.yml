name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13.15"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: uv sync --dev --locked
      - name: Prove heavy profiles are absent
        run: |
          uv run python - <<'PY'
          import importlib.util
          blocked = (
              "PIL",
              "faster_whisper",
              "imageio_ffmpeg",
              "markitdown",
              "py7zr",
              "tree_sitter",
          )
          present = [name for name in blocked if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"core profile unexpectedly contains: {present}")
          PY
      - name: Exercise core-only degradation and readers
        run: |
          uv run pytest -q \
            tests/unit/cli/test_model_commands.py::test_core_profile_ask_degrades_when_syntax_extra_is_missing \
            tests/unit/readers/test_text_and_structured.py \
            tests/security/test_archive_safety.py \
            tests/e2e/test_cli_commands.py::test_init_config_modules_doctor_and_clean_are_offline
      - run: uv run rivet --json doctor --section readers
      - run: uv run rivet --json modules list

  python-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13.15"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/lsp/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --all-extras --dev --locked
      - run: bun install --cwd tui --frozen-lockfile
      - run: npm ci --prefix tools/lsp --ignore-scripts --no-audit --no-fund
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -q --cov=src/rivet --cov-report=term-missing
      - run: uv run coverage report --fail-under=80

  tui-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --cwd tui --frozen-lockfile
      - run: bun test --cwd tui
      - run: bun run --cwd tui typecheck

  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13.15"
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run python scripts/verify_architecture.py
      - run: uv run python scripts/verify_ipc_contracts.py
      - run: uv run python scripts/verify_dependencies.py
      - run: uv lock --check

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13.15"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --all-extras --dev --locked
      - run: bun install --cwd tui --frozen-lockfile
      - run: uv run pytest tests/security tests/integration/test_bubblewrap.py -q
      - run: uv run python scripts/run_benchmark.py --suite security
      - run: uv run python scripts/verify_secrets.py --worktree --history
      - run: uv run python scripts/verify_licenses.py
      - run: uv pip check

  e2e-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13.15"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/lsp/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: uv sync --all-extras --dev --locked
      - run: npm ci --prefix tools/lsp --ignore-scripts --no-audit --no-fund
      - run: bun install --cwd tui --frozen-lockfile
      - run: uv run pytest tests/e2e -q
      - run: uv run python scripts/run_benchmark.py --suite all
