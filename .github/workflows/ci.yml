name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -q
      - run: uv run python scripts/verify_architecture.py
      - run: uv run python scripts/verify_ipc_contracts.py
      - run: uv run python scripts/verify_dependencies.py
      - run: uv run python scripts/verify_secrets.py --worktree --staged
