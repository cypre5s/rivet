[project]
name = "rivet"
version = "0.1.0"
description = "可靠、可审计的本地编程智能体"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
syntax = [
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
]
documents = [
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1.7,<0.2",
]
image = [
    "pillow>=12.2,<13",
]
media = [
    "imageio-ffmpeg>=0.6,<1",
]
archive = [
    "py7zr>=1.1.3,<2",
]
transcription = [
    "faster-whisper>=1.2.1,<2",
]
rich-reader = [
    "imageio-ffmpeg>=0.6,<1",
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1.7,<0.2",
    "pillow>=12.2,<13",
    "py7zr>=1.1.3,<2",
]

[project.scripts]
rivet = "rivet:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
markers = [
    "live: 需要显式凭据和联网的非默认测试",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests"]

[tool.coverage.run]
branch = true
source = ["rivet"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "coverage>=7.15.4",
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7,<8",
    "ruff>=0.16.5",
    "xlwt>=1.3,<2",
]
