[project]
name = "rivet"
version = "0.1.0"
description = "可靠、可审计的本地编程智能体"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
rivet = "rivet:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests"]

[tool.coverage.run]
branch = true
source = ["rivet"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "coverage>=7.15.4",
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
